[project]
name = "hello-agent"
version = "0.1.0"
description = "ReAct-style agent learning demos with a reusable core library"
readme = "README.md"
authors = [
    { name = "ryanYan", email = "vue12306@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
hello-agent = "hello_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
